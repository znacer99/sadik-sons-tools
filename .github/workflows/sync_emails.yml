name: Sync Emails to Candidate Portal

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  sync_inboxes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase

      - name: Run Automated Sync (hr, info, alighaith)
        run: |
          python extract_from_email.py --all
